name: soul
description: SOUL - mental health companion (Flutter)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Networking
  dio: ^5.5.0+1
  retrofit: ^4.1.0

  # State management
  flutter_riverpod: ^2.5.1

  # Models + serialization
  json_annotation: ^4.9.0

  # Secure storage for tokens
  flutter_secure_storage: ^9.2.2

  # Local storage (offline cache)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Utilities
  intl: ^0.19.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code generation
  build_runner: ^2.4.12
  retrofit_generator: ^8.1.0
  json_serializable: 6.8.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/web/soul_web.html

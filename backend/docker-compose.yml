services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: mh_user
      POSTGRES_PASSWORD: mh_pass
      POSTGRES_DB: mh_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    depends_on:
      - db
    # Use an env_file for local development to avoid shell-specific inline env var syntax
    # Create a .env in the same folder (or place one at repo root and adjust the path).
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./:/app:rw

volumes:
  pgdata:
    driver: local

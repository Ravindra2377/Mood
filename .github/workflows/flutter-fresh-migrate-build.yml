name: Flutter Fresh Migration and Build

on:
  workflow_dispatch: {}

concurrency:
  group: flutter-fresh-migrate-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate-and-build:
    name: Migrate to Fresh Flutter Project and Build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android SDK and accept licenses
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_SDK_ROOT:=/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ -x "$SDKM" ]]; then
            echo "Accepting Android SDK licenses..."
            yes | "$SDKM" --licenses > /dev/null || true
            echo "Installing required Android packages..."
            "$SDKM" "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true
          else
            echo "sdkmanager not available at $SDKM. Using runner defaults."
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        shell: bash
        run: flutter doctor -v || true

      - name: Create fresh Flutter project (soul_fresh)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          rm -rf soul_fresh
          flutter create -t app soul_fresh
          echo "Fresh project created in: $(pwd)/soul_fresh"
          ls -la soul_fresh

      - name: Copy Flutter code, assets, and pubspec into fresh project
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if [[ ! -d soul ]]; then
            echo "ERROR: Source Flutter project 'soul/' not found in repository root."
            exit 1
          fi

          # Copy lib/
          if [[ -d soul/lib ]]; then
            rm -rf soul_fresh/lib
            mkdir -p soul_fresh/lib
            cp -R soul/lib/. soul_fresh/lib/
          else
            echo "ERROR: Missing soul/lib directory"
            exit 1
          fi

          # Copy assets/ (optional)
          if [[ -d soul/assets ]]; then
            rm -rf soul_fresh/assets
            mkdir -p soul_fresh/assets
            cp -R soul/assets/. soul_fresh/assets/
          else
            echo "No assets/ directory found in soul (skipping)."
          fi

          # Copy pubspec.yaml (required)
          if [[ -f soul/pubspec.yaml ]]; then
            cp -f soul/pubspec.yaml soul_fresh/pubspec.yaml
          else
            echo "ERROR: Missing soul/pubspec.yaml"
            exit 1
          fi

          # Copy analysis_options.yaml (optional)
          if [[ -f soul/analysis_options.yaml ]]; then
            cp -f soul/analysis_options.yaml soul_fresh/analysis_options.yaml
          fi

          echo "Listing soul_fresh after copy:"
          find soul_fresh -maxdepth 2 -type f -print

      - name: Install dependencies (pub get)
        shell: bash
        working-directory: ${{ github.workspace }}/soul_fresh
        run: |
          set -euo pipefail
          flutter pub get

      - name: Add json_serializable (best-effort to avoid codegen conflicts)
        shell: bash
        working-directory: ${{ github.workspace }}/soul_fresh
        run: |
          set -euo pipefail
          dart pub add --dev json_serializable:^6.8.0 || true
          flutter pub get

      - name: Generate code (build_runner)
        shell: bash
        working-directory: ${{ github.workspace }}/soul_fresh
        run: |
          set -euo pipefail
          dart run build_runner build --delete-conflicting-outputs

      - name: Build debug APK (staging backend)
        shell: bash
        working-directory: ${{ github.workspace }}/soul_fresh
        env:
          BASE_URL: https://api-staging.soulapp.app
        run: |
          set -euo pipefail
          flutter build apk --debug --dart-define=BASE_URL="$BASE_URL"
          echo "Debug APKs produced:"
          ls -la build/app/outputs/flutter-apk || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: flutter-fresh-apk-debug
          path: soul_fresh/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Build release APK (production backend)
        shell: bash
        working-directory: ${{ github.workspace }}/soul_fresh
        env:
          BASE_URL: https://api.soulapp.app
        run: |
          set -euo pipefail
          flutter build apk --release --dart-define=BASE_URL="$BASE_URL"
          echo "Release APKs produced:"
          ls -la build/app/outputs/flutter-apk || true

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: flutter-fresh-apk-release
          path: soul_fresh/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Summary
        shell: bash
        run: |
          echo "Fresh Flutter migration and APK builds completed." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts:" >> $GITHUB_STEP_SUMMARY
          echo "- flutter-fresh-apk-debug" >> $GITHUB_STEP_SUMMARY
          echo "- flutter-fresh-apk-release" >> $GITHUB_STEP_SUMMARY

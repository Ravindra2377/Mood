name: Android Build APK via Docker

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "APK variant to build (stagingDebug, prodDebug, prodRelease). Leave empty to build all."
        required: false
        default: ""
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android-build-apk-docker.yml"
  pull_request:
    paths:
      - "android-app/**"
      - ".github/workflows/android-build-apk-docker.yml"

concurrency:
  group: android-build-apk-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build ${{ matrix.variant }} APK via Docker
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - variant: stagingDebug
            build_task: ":app:assembleStagingDebug"
            apk_path: "/app/app/build/outputs/apk/staging/debug/app-staging-debug.apk"
            artifact_name: "app-staging-debug.apk"
          - variant: prodDebug
            build_task: ":app:assembleProdDebug"
            apk_path: "/app/app/build/outputs/apk/prod/debug/app-prod-debug.apk"
            artifact_name: "app-prod-debug.apk"
          - variant: prodRelease
            build_task: ":app:assembleProdRelease"
            # Signed APK is produced inside Dockerfile.android using a debug-style key
            apk_path: "/app/app/build/outputs/apk/prod/release/app-prod-release.apk"
            artifact_name: "app-prod-release.apk"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Skip non-requested variants when workflow_dispatch specifies a single one
      - name: Determine if this matrix item should run
        id: should_run
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.variant }}" ] && [ "${{ matrix.variant }}" != "${{ github.event.inputs.variant }}" ]; then
            echo "run=false" >> $GITHUB_OUTPUT
          else
            echo "run=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.should_run.outputs.run == 'true'
        uses: docker/setup-buildx-action@v3

      # Create Dockerfile.android on-the-fly if it isn't committed in this branch
      - name: Ensure Dockerfile.android exists
        if: steps.should_run.outputs.run == 'true'
        working-directory: android-app
        run: |
          set -euo pipefail
          if [ ! -f Dockerfile.android ]; then
            echo "Dockerfile.android not found; creating it for this run..."
            cat > Dockerfile.android <<'EOF'
FROM ubuntu:22.04
ENV DEBIAN_FRONTEND=noninteractive
RUN apt-get update && apt-get install -y \
    openjdk-11-jdk wget curl unzip zip git ca-certificates \
  && rm -rf /var/lib/apt/lists/*
ENV JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64
ENV PATH="$JAVA_HOME/bin:${PATH}"

ENV ANDROID_SDK_ROOT=/opt/android-sdk
RUN mkdir -p "${ANDROID_SDK_ROOT}/cmdline-tools" \
 && curl -sSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip \
 && unzip -q /tmp/cmdtools.zip -d "${ANDROID_SDK_ROOT}/cmdline-tools" \
 && rm -f /tmp/cmdtools.zip \
 && mv "${ANDROID_SDK_ROOT}/cmdline-tools/cmdline-tools" "${ANDROID_SDK_ROOT}/cmdline-tools/latest"
ENV PATH="${PATH}:${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin:${ANDROID_SDK_ROOT}/platform-tools"
RUN mkdir -p /root/.android && touch /root/.android/repositories.cfg \
 && yes | sdkmanager --licenses > /dev/null
RUN sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

ENV GRADLE_HOME=/opt/gradle/gradle-7.6
RUN curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-7.6-bin.zip \
 && mkdir -p /opt/gradle \
 && unzip -q /tmp/gradle.zip -d /opt/gradle \
 && rm -f /tmp/gradle.zip
ENV PATH="${PATH}:${GRADLE_HOME}/bin"

WORKDIR /app
COPY . /app

RUN printf "sdk.dir=%s\n" "${ANDROID_SDK_ROOT}" > /app/local.properties
RUN gradle -v && java -version
RUN ( [ -f ./gradlew ] && ./gradlew --version ) || gradle wrapper --gradle-version 7.6
RUN chmod +x ./gradlew

ARG BUILD_TASK=":app:assembleStagingDebug"
ENV BUILD_TASK=${BUILD_TASK}

RUN set -e; \
    ./gradlew ${BUILD_TASK} --stacktrace --no-daemon; \
    unsigned="/app/app/build/outputs/apk/prod/release/app-prod-release-unsigned.apk"; \
    if [ -f "$unsigned" ]; then \
      echo "Generating debug-style keystore for signing..."; \
      keytool -genkeypair -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
        -dname "CN=Android Debug,O=Android,C=US" \
        -keystore /tmp/debug.keystore -storepass android -keypass android; \
      echo "Signing prod release APK..."; \
      "$ANDROID_SDK_ROOT/build-tools/33.0.2/apksigner" sign \
        --ks /tmp/debug.keystore \
        --ks-pass pass:android \
        --key-pass pass:android \
        --ks-key-alias androiddebugkey \
        --out /app/app/build/outputs/apk/prod/release/app-prod-release.apk \
        "$unsigned"; \
      "$ANDROID_SDK_ROOT/build-tools/33.0.2/apksigner" verify /app/app/build/outputs/apk/prod/release/app-prod-release.apk; \
      echo "Signed APK at /app/app/build/outputs/apk/prod/release/app-prod-release.apk"; \
    fi
EOF
          fi
          echo "Using Dockerfile.android:"
          head -n 40 Dockerfile.android

      - name: Build Docker image for ${{ matrix.variant }}
        if: steps.should_run.outputs.run == 'true'
        working-directory: android-app
        run: |
          set -euo pipefail
          echo "Building Docker image for task ${{ matrix.build_task }}"
          echo "PWD:"; pwd
          echo "Listing android-app contents:"
          ls -la
          docker build \
            -f Dockerfile.android \
            --build-arg BUILD_TASK="${{ matrix.build_task }}" \
            -t soul-android-build:${{ matrix.variant }} \
            .

      - name: Extract APK from image
        if: steps.should_run.outputs.run == 'true'
        id: extract
        run: |
          set -euo pipefail
          CID="$(docker create soul-android-build:${{ matrix.variant }})"
          mkdir -p "android-apks/${{ matrix.variant }}"
          docker cp "$CID":"${{ matrix.apk_path }}" "android-apks/${{ matrix.variant }}/${{ matrix.artifact_name }}"
          docker rm "$CID" >/dev/null
          echo "apk_out=android-apks/${{ matrix.variant }}/${{ matrix.artifact_name }}" >> $GITHUB_OUTPUT
          ls -la "android-apks/${{ matrix.variant }}"

      - name: Upload APK artifact
        if: steps.should_run.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.variant }}-apk
          path: ${{ steps.extract.outputs.apk_out }}
          if-no-files-found: error
          retention-days: 7

  summary:
    name: Build summary
    runs-on: ubuntu-latest
    needs: build-apk
    steps:
      - name: Summary
        run: |
          echo "Android APK build via Docker completed." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts uploaded (if selected to run):" >> $GITHUB_STEP_SUMMARY
          echo "- android-stagingDebug-apk" >> $GITHUB_STEP_SUMMARY
          echo "- android-prodDebug-apk" >> $GITHUB_STEP_SUMMARY
          echo "- android-prodRelease-apk (signed)" >> $GITHUB_STEP_SUMMARY

name: Android JVM Unit Tests

on:
  push:
    paths:
      - "android-app/**"
  pull_request:
    paths:
      - "android-app/**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: "11"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-33
            build-tools;33.0.2

      - name: Install Gradle (no wrapper)
        run: |
          set -e
          GV=7.6
          echo "Installing Gradle ${GV}..."
          curl -sSL -o /tmp/gradle.zip "https://services.gradle.org/distributions/gradle-${GV}-bin.zip"
          sudo mkdir -p /opt/gradle
          sudo unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-${GV}/bin" >> "$GITHUB_PATH"
          gradle -v

      - name: Point local.properties to CI Android SDK
        working-directory: android-app
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
          echo "Wrote local.properties with sdk.dir=${ANDROID_SDK_ROOT}"

      - name: Run JVM unit tests
        run: |
          gradle -p android-app :app:testStagingDebugUnitTest :app:testProdDebugUnitTest --info --stacktrace --no-daemon

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            android-app/app/build/test-results/testStagingDebugUnitTest/
            android-app/app/build/test-results/testProdDebugUnitTest/
          if-no-files-found: warn

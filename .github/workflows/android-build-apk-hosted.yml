name: Android Build APK (Hosted, direct SDK install)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "APK variant to build (stagingDebug, prodDebug, prodRelease)"
        required: false
        default: "prodRelease"

concurrency:
  group: android-build-hosted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build ${{ inputs.variant || 'prodRelease' }} APK (Hosted)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (required by cmdline-tools 16+)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK and packages
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_SDK_ROOT="${HOME}/android-sdk"
          mkdir -p "${ANDROID_SDK_ROOT}/cmdline-tools"
          curl -sSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q /tmp/cmdtools.zip -d "${ANDROID_SDK_ROOT}/cmdline-tools"
          mv "${ANDROID_SDK_ROOT}/cmdline-tools/cmdline-tools" "${ANDROID_SDK_ROOT}/cmdline-tools/latest"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${ANDROID_SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"

          # Accept SDK licenses without a pipe (avoids SIGPIPE)
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses <<'EOF'
          y
          y
          y
          y
          y
          EOF

          # Install required packages explicitly
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

      - name: Cache Gradle caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/daemon
          key: ${{ runner.os }}-gradle-${{ hashFiles('android-app/**/build.gradle*', 'android-app/**/settings.gradle*', 'android-app/**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Gradle 7.6 (no wrapper)
        shell: bash
        run: |
          set -e
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-7.6-bin.zip
          sudo mkdir -p /opt/gradle
          sudo unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-7.6/bin" >> $GITHUB_PATH
          gradle -v
          java -version

      - name: Ensure AndroidX flags exist in gradle.properties
        working-directory: android-app
        shell: bash
        run: |
          set -euo pipefail
          touch gradle.properties
          grep -q '^android.useAndroidX=true' gradle.properties || echo 'android.useAndroidX=true' >> gradle.properties
          grep -q '^android.enableJetifier=true' gradle.properties || echo 'android.enableJetifier=true' >> gradle.properties
          echo "----- gradle.properties -----"
          cat gradle.properties

      - name: Configure local.properties to use CI SDK
        working-directory: android-app
        shell: bash
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
          cat local.properties

      - name: Select build variant and paths
        id: sel
        shell: bash
        run: |
          set -euo pipefail
          variant="${{ inputs.variant || 'prodRelease' }}"
          case "$variant" in
            stagingDebug)
              echo "build_task=:app:assembleStagingDebug" >> $GITHUB_OUTPUT
              echo "apk_dir=android-app/app/build/outputs/apk/staging/debug" >> $GITHUB_OUTPUT
              echo "artifact_name=android-stagingDebug-apk" >> $GITHUB_OUTPUT
              ;;
            prodDebug)
              echo "build_task=:app:assembleProdDebug" >> $GITHUB_OUTPUT
              echo "apk_dir=android-app/app/build/outputs/apk/prod/debug" >> $GITHUB_OUTPUT
              echo "artifact_name=android-prodDebug-apk" >> $GITHUB_OUTPUT
              ;;
            prodRelease|*)
              echo "build_task=:app:assembleProdRelease" >> $GITHUB_OUTPUT
              echo "apk_dir=android-app/app/build/outputs/apk/prod/release" >> $GITHUB_OUTPUT
              echo "artifact_name=android-prodRelease-apk" >> $GITHUB_OUTPUT
              ;;
          esac
          echo "variant=$variant" >> $GITHUB_OUTPUT

      - name: Build with Gradle (force AndroidX flags)
        run: |
          gradle \
            -Dandroid.useAndroidX=true \
            -Dandroid.enableJetifier=true \
            -p android-app \
            ${{ steps.sel.outputs.build_task }} \
            --stacktrace --no-daemon --warning-mode all

      - name: Auto-sign prodRelease (debug-style key)
        if: steps.sel.outputs.variant == 'prodRelease'
        shell: bash
        run: |
          set -euo pipefail
          dir="${{ steps.sel.outputs.apk_dir }}"
          unsigned="$dir/app-prod-release-unsigned.apk"
          signed="$dir/app-prod-release.apk"
          if [ -f "$signed" ]; then
            echo "Signed APK already present: $signed"
            exit 0
          fi
          if [ ! -f "$unsigned" ]; then
            echo "No unsigned APK found at $unsigned (AGP may have already signed)."
            exit 0
          fi
          keytool -genkeypair -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keystore /tmp/debug.keystore -storepass android -keypass android
          "$ANDROID_SDK_ROOT/build-tools/33.0.2/apksigner" sign \
            --ks /tmp/debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out "$signed" \
            "$unsigned"
          "$ANDROID_SDK_ROOT/build-tools/33.0.2/apksigner" verify "$signed"
          echo "Signed APK at: $signed"

      - name: Show built APKs
        run: |
          echo "Listing ${{ steps.sel.outputs.apk_dir }}"
          ls -la "${{ steps.sel.outputs.apk_dir }}" || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.sel.outputs.artifact_name }}
          path: ${{ steps.sel.outputs.apk_dir }}/*.apk
          if-no-files-found: error
          retention-days: 7

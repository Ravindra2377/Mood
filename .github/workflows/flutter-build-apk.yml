name: Flutter Build APK

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Build mode (debug or release)"
        required: false
        default: "release"
      base_url:
        description: "Backend base URL passed via --dart-define=BASE_URL"
        required: false
        default: "https://api.soulapp.app"
      build_name:
        description: "Optional Flutter build name (e.g., 1.0.0)"
        required: false
        default: ""
      build_number:
        description: "Optional Flutter build number (e.g., 1)"
        required: false
        default: ""

concurrency:
  group: flutter-build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build SOUL APK (${{ inputs.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (required by recent Android cmdline-tools)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android SDK and accept licenses
        shell: bash
        run: |
          set -euo pipefail
          # Prefer runner-provided Android SDK, fallback to common path
          : "${ANDROID_SDK_ROOT:=/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ -x "$SDKM" ]]; then
            echo "Accepting Android SDK licenses..."
            "$SDKM" --licenses <<'EOF'
            y
            y
            y
            y
            y
EOF
            echo "Installing required Android SDK packages..."
            "$SDKM" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          else
            echo "sdkmanager not found at $SDKM, skipping explicit install; relying on runner defaults."
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure Flutter project scaffold exists (first run safety)
        shell: bash
        working-directory: soul
        run: |
          set -euo pipefail
          if [[ ! -d android ]]; then
            echo "android/ folder missing; running 'flutter create .' to scaffold platforms..."
            flutter create .
          fi

      - name: Install dependencies
        shell: bash
        working-directory: soul
        run: |
          set -euo pipefail
          flutter pub get

      - name: Generate code (build_runner)
        shell: bash
        working-directory: soul
        run: |
          set -euo pipefail
          dart run build_runner build --delete-conflicting-outputs

      - name: Build APK
        shell: bash
        working-directory: soul
        env:
          MODE: ${{ inputs.mode }}
          BASE_URL: ${{ inputs.base_url }}
          BUILD_NAME: ${{ inputs.build_name }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          BUILD_ARGS=()

          # Build mode
          if [[ "${MODE,,}" == "debug" ]]; then
            BUILD_ARGS+=(--debug)
          else
            BUILD_ARGS+=(--release)
          fi

          # Optional versioning flags for release builds
          if [[ -n "${BUILD_NAME}" ]]; then
            BUILD_ARGS+=(--build-name="${BUILD_NAME}")
          fi
          if [[ -n "${BUILD_NUMBER}" ]]; then
            BUILD_ARGS+=(--build-number="${BUILD_NUMBER}")
          fi

          # Backend base URL
          BUILD_ARGS+=(--dart-define=BASE_URL="$BASE_URL")

          echo "flutter build apk ${BUILD_ARGS[*]}"
          flutter build apk "${BUILD_ARGS[@]}"

          echo "APK(s) produced in: build/app/outputs/flutter-apk"
          ls -la build/app/outputs/flutter-apk || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apk-${{ inputs.mode }}
          path: soul/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Summary
        run: |
          echo "Build complete." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Inputs:" >> $GITHUB_STEP_SUMMARY
          echo "- mode: ${{ inputs.mode }}" >> $GITHUB_STEP_SUMMARY
          echo "- base_url: ${{ inputs.base_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- build_name: ${{ inputs.build_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- build_number: ${{ inputs.build_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Artifact uploaded:" >> $GITHUB_STEP_SUMMARY
          echo "- flutter-apk-${{ inputs.mode }} (contains *.apk)" >> $GITHUB_STEP_SUMMARY

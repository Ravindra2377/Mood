name: soul
description: SOUL - mental health companion (Flutter)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  audioplayers: ^5.0.0
  collection: ^1.18.0
  cupertino_icons: ^1.0.8
  dio: ^5.5.0+1
  fl_chart: ^0.68.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^9.2.2
  google_fonts: ^6.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.1.0
  intl: ^0.19.0
  json_annotation: ^4.9.0
  retrofit: ^4.1.0
  shared_preferences: ^2.2.3
  url_launcher: ^6.2.0
  uuid: ^4.1.0
  vibration: ^3.1.4
  webview_flutter: ^4.7.0
dev_dependencies:
  build_runner: ^2.4.12
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  json_serializable: ^6.8.0
  retrofit_generator: ^8.1.2

flutter:
  uses-material-design: true
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Regular.ttf
        - asset: assets/fonts/OpenSans-Bold.ttf
          weight: 700
  assets:
    - assets/web/soul_web.html
    - assets/audio/
    - assets/images/brain.png
    - assets/images/meditation_child.png
    - assets/images/mood_angry.png
    - assets/images/mood_sad.png
    - assets/images/mood_neutral.png
    - assets/images/mood_happy.png
    - assets/images/mood_veryhappy.png
    - assets/images/panda_mascot_green.png
